version: '3.9'

services:
  app:
    build:
      context: .
      target: production
    container_name: healthcare-ai-assistant
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_PERSIST_DIR=/app/vector_store
      - DATA_DIR=/app/data
    volumes:
      - vector_store:/app/vector_store
      - hf_cache:/app/.cache/huggingface
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  vector_store:
  hf_cache:
  ollama_models:
